name: Build release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the draft release (for example, v1.2.0)
        required: true
        type: string
      verify_only:
        description: Build and verify packages without creating a release draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    env:
      PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            asset: smi2assF.osx-arm64.dmg
            python-version: '3.14'
            timeout-minutes: 75
          - os: windows-latest
            platform: windows-x86_64
            asset: smi2assF.windows-x86_64.exe
            python-version: '3.13'
            timeout-minutes: 15
    steps:
      - name: Require master branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Run this workflow from the master branch." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Prepare Apple signing and notarization
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python -m scripts.macos_signing prepare

      - name: Install dependencies
        shell: bash
        run: bash install.sh

      - name: Verify GUI runtime and build package
        shell: bash
        env:
          MACOS_RELEASE_SIGNING: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: bash build.sh

      - name: Preserve Apple notarization diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-diagnostics
          path: build/macos-signing-logs/
          if-no-files-found: ignore

      - name: Clean up Apple signing credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: python -m scripts.macos_signing cleanup

      - name: Preserve Windows installer diagnostics
        if: ${{ always() && matrix.platform == 'windows-x86_64' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer-diagnostics
          path: build/installer-smoke-logs/
          if-no-files-found: ignore

      - name: Upload release file without ZIP packaging
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/gui-dist/${{ matrix.asset }}
          archive: false
          if-no-files-found: error

      - name: Upload checksum without ZIP packaging
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/gui-dist/${{ matrix.asset }}.sha256
          archive: false
          if-no-files-found: error

  create-draft-release:
    name: Create draft release
    if: ${{ !inputs.verify_only }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: smi2assF.*
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded release files
        shell: bash
        run: |
          cd release-assets
          test -s smi2assF.osx-arm64.dmg
          test -s smi2assF.windows-x86_64.exe
          sha256sum --check smi2assF.osx-arm64.dmg.sha256
          sha256sum --check smi2assF.windows-x86_64.exe.sha256

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.0 or v1.2.0-rc.1." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
