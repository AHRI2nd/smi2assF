name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Python 3.14 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYTHON: python
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: bash install.sh

      - name: Run tests and build executable
        shell: bash
        run: bash build.sh

      - name: Upload executable and checksum
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smi2ass-${{ matrix.os }}
          path: build/dist/smi2ass.*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: smi2ass-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release-assets/*
